services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-property_management}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-property_management}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pm_net

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pm_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pm_net

  backend:
    build:
      context: ./property-management-be
    container_name: pm_backend
    restart: unless-stopped
    env_file:
      - ./property-management-be/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      AI_AGENT_URL: http://ai-agent:8080
      WHATSAPP_API_ENABLED: ${WHATSAPP_API_ENABLED:-false}
    ports:
      - "${APP_PORT:-4000}:4000"
    volumes:
      - ./property-management-be:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pm_net

  ai-agent:
    build:
      context: ./ai-agent
    container_name: pm_agent
    restart: unless-stopped
    env_file:
      - ./ai-agent/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "${AGENT_PORT:-5000}:8080"
    volumes:
      - ./ai-agent:/app
      - agent_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pm_net

  frontend:
    build:
      context: ./property-management-fe
    container_name: pm_frontend
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: http://backend:4000
      VITE_API_URL: http://localhost:4000
    ports:
      - "${FE_PORT:-3000}:3000"
    volumes:
      - ./property-management-fe:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - pm_net

volumes:
  pgdata:
  pgadmin_data:
  backend_node_modules:
  agent_node_modules:
  frontend_node_modules:

networks:
  pm_net:
    driver: bridge
