services:
  db:
    image: postgres:16-alpine
    container_name: pm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-property_management}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-property_management}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pm_net

  backend:
    build:
      context: ./property-management-be
    container_name: pm_backend
    restart: unless-stopped
    env_file:
      - ./property-management-be/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "${APP_PORT:-4000}:4000"
    volumes:
      - ./property-management-be:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pm_net

  frontend:
    build:
      context: ./property-management-fe
    container_name: pm_frontend
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: http://backend:4000
      VITE_API_URL: http://localhost:4000
    ports:
      - "${FE_PORT:-3000}:3000"
    volumes:
      - ./property-management-fe:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - pm_net

volumes:
  pgdata:
  backend_node_modules:
  frontend_node_modules:

networks:
  pm_net:
    driver: bridge
